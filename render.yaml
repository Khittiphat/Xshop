services:
  - type: web
    name: xmart-app
    env: docker
    plan: starter
    dockerfilePath: Dockerfile
    healthCheckPath: /api/health
    disk:
      name: xmart-disk
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /data
